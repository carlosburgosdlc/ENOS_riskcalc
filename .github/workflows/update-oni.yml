name: Actualizar ONI (NOAA CPC)

on:
  schedule:
    - cron: "0 12 12 * *" # día 12 de cada mes (CPC publica ~día 10)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python scripts/update_oni.py
      - run: pytest -q
      - name: Commit si cambió
        run: |
          if git diff --quiet superninio/datos/oni.json; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add superninio/datos/oni.json
          git commit -m "data: actualizar ONI desde NOAA CPC"
          git push
